version: '3.9'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airflights}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airflights}"]
      interval: 5s
      timeout: 3s
      retries: 20
    container_name: postgres

  # ===== INFRASTRUCTURE =====
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports: ["8761:8761", "5005:5005"]
    depends_on: [postgres]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8761/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
    container_name: eureka-server

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    ports: ["9991:9991", "5006:5006"]
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/cfgs
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
    volumes:
      - ./cfgs/config-server-main:/cfgs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9991/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    container_name: config-server

  gateway-server:
    build:
      context: ./gateway-server
      dockerfile: Dockerfile
    ports: ["8080:8080", "5007:5007"]
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
    container_name: gateway-server

  # ===== MICROSERVICES =====
  airline-service:
    build:
      context: ./airline-service
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports: ["5008:5008"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5008
    container_name: airline-service

  airport-service:
    build:
      context: ./airport-service
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports: ["5009:5009"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5009
    container_name: airport-service

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports: [ "5010:5010" ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5010
    container_name: booking-service

  flight-service:
    build:
      context: ./flight-service
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports: [ "5011:5011" ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5011
    container_name: flight-service

  passenger-service:
    build:
      context: ./passenger-service
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports: [ "5012:5012" ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5012
    container_name: passenger-service

  restrictedzone-service:
    build:
      context: ./restrictedzone-service
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports: [ "5013:5013" ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5013
    container_name: restrictedzone-service

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports: [ "5014:5014" ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      AUTH_BOOTSTRAP_USERNAME: admin
      AUTH_BOOTSTRAP_EMAIL: admin@itmo.ru
      AUTH_BOOTSTRAP_PASSWORD: 1234
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5014
    container_name: auth-service

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports: [ "5015:5015" ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5015
    container_name: notification-service

  file-service:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports: [ "5016:5016" ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5016
    container_name: file-service

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ===== KAFKA (KRaft, 3 brokers) =====
  kafka-1:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r9
    container_name: kafka-1
    ports:
      - "9092:9094"
    environment:
      KAFKA_KRAFT_CLUSTER_ID: qCTS2dxvQyG4y9He75UH9g
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
    volumes:
      - kafka1_data:/bitnamilegacy/kafka

  kafka-2:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r9
    container_name: kafka-2
    environment:
      KAFKA_KRAFT_CLUSTER_ID: qCTS2dxvQyG4y9He75UH9g
      KAFKA_CFG_NODE_ID: 2
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
    volumes:
      - kafka2_data:/bitnamilegacy/kafka

  kafka-3:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r9
    container_name: kafka-3
    environment:
      KAFKA_KRAFT_CLUSTER_ID: qCTS2dxvQyG4y9He75UH9g
      KAFKA_CFG_NODE_ID: 3
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
    volumes:
      - kafka3_data:/bitnamilegacy/kafka

  kafka-init:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r9
    container_name: kafka-init
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: ["/bin/bash", "-c"]
    command: >
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists
      --replication-factor 3 --partitions 3 --topic booking.events &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists
      --replication-factor 3 --partitions 3 --topic flight.events &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists
      --replication-factor 3 --partitions 3 --topic file.events &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists
      --replication-factor 3 --partitions 3 --topic notification.commands &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists
      --replication-factor 3 --partitions 3 --topic booking.events.dlq &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists
      --replication-factor 3 --partitions 3 --topic flight.events.dlq &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists
      --replication-factor 3 --partitions 3 --topic file.events.dlq &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists
      --replication-factor 3 --partitions 3 --topic notification.commands.dlq
    restart: "no"

  # ===== S3 (MinIO) =====
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/airflights-files &&
      mc ls local
    restart: "no"
volumes:
  pg-data:
  pgadmin_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  minio_data:
