spring:
  application:
    name: auth-service
  config:
    import: "config-server:http://config-server:9991"
  cloud:
    config:
      request-connect-timeout: 10000
      request-read-timeout: 25000
      retry:
        max-attempts: 20
        initial-interval: 1000
        multiplier: 1.5
        max-interval: 5000